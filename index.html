<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUMMY LIVE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071b16;color:#f5f5f0;font:15px Arial}
header{padding:18px;text-align:center;background:#09291e;border-bottom:2px solid #d8b64f}
h1,.gold{color:#f4cf67}
main{max-width:950px;margin:auto;padding:12px}
.box{background:#102b23;border:1px solid #315748;border-radius:12px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
input{width:100%;padding:12px;margin:5px 0;background:#071b16;color:white;border:1px solid #315748;border-radius:8px}
button{padding:11px 13px;margin:3px;border:0;border-radius:8px;background:#f4cf67;font-weight:bold}
.alt{background:#285443;color:white}
.danger{background:#853c3c;color:white}
.hide{display:none}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.game{background:#174333;color:white;text-align:left;min-height:65px}
.game b{display:block;color:#f4cf67}
.muted{color:#b8c8bf}
.result{font-size:20px;color:#f4cf67;margin:12px}
.cards{display:flex;gap:5px;flex-wrap:wrap}
.card{background:white;color:#111;padding:10px;border-radius:6px}
table{width:100%;font-size:13px}
td{padding:6px;border-bottom:1px solid #315748}
@media(max-width:450px){.games{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<header>
<h1>RUMMY LIVE</h1>
<small>Virtual practice • No cash withdrawal</small>
</header>

<main>
<section id="auth" class="box">
<h2 class="gold">Player Login / Register</h2>
<input id="u" placeholder="Username">
<input id="p" type="password" placeholder="Password">
<button onclick="login('login')">Login</button>
<button class="alt" onclick="login('register')">Register</button>
<button class="alt" onclick="show('adminLogin')">Admin Login</button>
<p id="msg"></p>
</section>

<section id="player" class="hide">
<div class="box row">
<div class="grow">
<b id="who"></b>
<div class="muted">Virtual coins</div>
</div>
<strong class="gold" id="bal">0</strong>
<button class="alt" onclick="me()">Refresh</button>
<button class="danger" onclick="logout()">Logout</button>
</div>

<div class="box">
<h2 class="gold">20 Games</h2>
<div id="games" class="games"></div>
</div>

<div class="box">
<h2 id="gtitle" class="gold"></h2>
<p id="roomInfo" class="muted"></p>
<div id="gameArea"></div>
</div>

<div class="box">
<h3 class="gold">Coin Request</h3>
<input id="amount" type="number" placeholder="Amount">
<button onclick="requestCoins()">Send request</button>
<p id="reqmsg"></p>
</div>

<div class="box">
<h3 class="gold">Activity</h3>
<button class="alt" onclick="history()">Refresh</button>
<div id="hist"></div>
</div>
</section>

<section id="adminLogin" class="box hide">
<h2 class="gold">Admin Login</h2>
<input id="au" placeholder="Admin username">
<input id="ap" type="password" placeholder="Admin password">
<button onclick="adminLogin()">Login</button>
<button class="alt" onclick="show('auth')">Back</button>
<p id="amsg"></p>
</section>

<section id="admin" class="hide">
<div class="box">
<h2 class="gold">Admin Panel</h2>
<button class="alt" onclick="adminLoad()">Refresh</button>
<button class="danger" onclick="logout()">Logout</button>
<div id="stats"></div>
</div>
<div class="box">
<h3>Players / Coin Control</h3>
<div id="plist"></div>
</div>
<div class="box">
<h3>Coin Requests</h3>
<div id="rlist"></div>
</div>
</section>
</main>

<script src="/socket.io/socket.io.js"></script>
<script>
const $=x=>document.getElementById(x);

const games=[
"Rummy","Teen Patti","Roulette","Dragon Tiger",
"Andar Bahar","Poker","Blackjack","Baccarat",
"Slots","Dice","Lucky 7","Hi-Lo","Coin Toss",
"Number Guess","Red & Black","Wheel Spin",
"Memory Match","Lucky Draw","Color Prediction","Quick 21"
];

let token=localStorage.getItem("rl_token")||"";
let role=localStorage.getItem("rl_role")||"";
let sock,room=null;

function show(id){
["auth","player","adminLogin","admin"].forEach(x=>$(x).classList.add("hide"));
$(id).classList.remove("hide");
}

async function api(path,opts={}){
let r=await fetch(path,{
...opts,
headers:{
"Content-Type":"application/json",
...(token?{Authorization:"Bearer "+token}:{})
}
});
let d=await r.json();
if(!r.ok)throw Error(d.error||"Request failed");
return d;
}

async function login(a){
try{
let d=await api("/api/"+a,{
method:"POST",
body:JSON.stringify({
username:$("u").value,
password:$("p").value
})
});
token=d.token;
role="player";
save();
await me();
}catch(e){
$("msg").textContent=e.message;
}
}

async function adminLogin(){
try{
let d=await api("/api/admin/login",{
method:"POST",
body:JSON.stringify({
username:$("au").value,
password:$("ap").value
})
});
token=d.token;
role="admin";
save();
adminLoad();
}catch(e){
$("amsg").textContent=e.message;
}
}

function save(){
localStorage.setItem("rl_token",token);
localStorage.setItem("rl_role",role);
}

function connect(){
if(sock)sock.disconnect();
sock=io({auth:{token}});
sock.on("room:update",r=>room=r);
sock.on("game:started",r=>{
room=r;
renderRoom();
});
sock.on("game:state",s=>renderState(s));
}

async function me(){
try{
let d=await api("/api/me");
let p=d.player;
show("player");
$("who").textContent=p.username;
$("bal").textContent=p.coins;
renderGames();
connect();
history();
}catch(e){
logout();
$("msg").textContent=e.message;
}
}

function renderGames(){
$("games").innerHTML=games.map((g,i)=>
`<button class="game" onclick="chooseGame(${i})">
<b>${i+1}. ${g}</b>
<small>Multiplayer table</small>
</button>`
).join("");
}

function chooseGame(i){
let g=games[i];
$("gtitle").textContent=g;
$("gameArea").innerHTML="";
$("roomInfo").textContent="Create a table or join an open table.";

let a=document.createElement("button");
a.textContent="Create table";
a.onclick=()=>{
sock.emit("room:create",{game:g},r=>{
if(r.ok){
room=r.room;
renderRoom();
}else alert(r.error);
});
};
$("gameArea").append(a);

let b=document.createElement("button");
b.textContent="Find tables";
b.className="alt";
b.onclick=()=>{
sock.emit("room:list",rs=>{
let area=$("gameArea");
area.innerHTML="";
rs.filter(x=>x.game===g).forEach(x=>{
let z=document.createElement("button");
z.textContent="Join "+x.id+" ("+x.players.length+" players)";
z.onclick=()=>{
sock.emit("room:join",{roomId:x.id},r=>{
if(r.ok){
room=r.room;
renderRoom();
}else alert(r.error);
});
};
area.append(z);
});
});
};
$("gameArea").append(b);
}

function renderRoom(){
if(!room)return;
$("roomInfo").textContent="Table "+room.id+" • "+room.game+" • "+room.players.map(p=>p.username).join(", ");
let area=$("gameArea");
area.innerHTML="";
let start=document.createElement("button");
start.textContent="Start game";
start.onclick=()=>{
sock.emit("game:start",{roomId:room.id},r=>{
if(r.ok)renderState(r.state);
else alert(r.error);
});
};
area.append(start);
}

function renderState(s){
if(!s)return;
room=s.room;
$("roomInfo").textContent="Table "+room.id+" • "+room.game+" • Players: "+room.players.map(p=>p.username).join(", ");

let a=$("gameArea");
a.innerHTML="";

let hand=document.createElement("div");
hand.className="cards";
(s.hand||[]).forEach((c,i)=>{
let x=document.createElement("span");
x.className="card";
x.textContent=c.r+c.s;
x.dataset.index=i;
hand.append(x);
});
a.append(hand);

const act=(label,action,payload={})=>{
let b=document.createElement("button");
b.textContent=label;
b.onclick=()=>{
sock.emit("game:action",{roomId:room.id,action,payload},r=>{
if(r.ok)renderState(r.state);
else alert(r.error);
});
};
a.append(b);
};

let g=room.game;

if(g==="Rummy"){
act("Draw from deck","draw");
act("Draw discard","draw",{fromDiscard:true});
act("Discard first card","discard",{index:0});
}
else if(["Teen Patti","Poker","Baccarat","Dragon Tiger"].includes(g)){
act("Reveal result","show");
}
else if(g==="Roulette"||g==="Slots"){
act("Spin","spin");
}
else if(g==="Andar Bahar"){
act("Draw next card","draw");
}
else if(["Blackjack","Quick 21"].includes(g)){
act("Hit","hit");
act("Stand","stand");
}
else{
act("Play round","play");
}

let pre=document.createElement("pre");
pre.style.whiteSpace="pre-wrap";
pre.textContent=JSON.stringify(room.state||{},null,2);
a.append(pre);
}

async function requestCoins(){
try{
await api("/api/coin-request",{
method:"POST",
body:JSON.stringify({amount:Number($("amount").value)})
});
$("reqmsg").textContent="Request sent";
}catch(e){
$("reqmsg").textContent=e.message;
}
}

async function history(){
try{
let d=await api("/api/history");
$("hist").innerHTML=(d.history||[]).map(x=>
`<p>${x.action} • ${x.amount}</p>`
).join("")||"No activity";
}catch(e){}
}

async function adminLoad(){
try{
let [o,p,q]=await Promise.all([
api("/api/admin/overview"),
api("/api/admin/players"),
api("/api/admin/requests")
]);

show("admin");
$("stats").textContent="Players "+o.players+
" • Total coins "+o.total_coins+
" • Pending "+o.pending_requests;

$("plist").innerHTML=(p.players||[]).map(x=>
`<p>${x.username} (${x.coins})
<input id="c${x.id}" type="number" placeholder="+/- coins">
<button onclick="coin(${x.id})">Apply</button></p>`
).join("");

$("rlist").innerHTML=(q.requests||[]).map(x=>
`<p>${x.username} • ${x.amount} • ${x.status}
${x.status==="pending"?
`<button onclick="req(${x.id},'approve')">Approve</button>
<button onclick="req(${x.id},'reject')">Reject</button>`:""}
</p>`
).join("");

}catch(e){
$("amsg").textContent=e.message;
}
}

async function coin(id){
try{
await api("/api/admin/coins",{
method:"POST",
body:JSON.stringify({
playerId:id,
amount:Number($("c"+id).value)
})
});
adminLoad();
}catch(e){
alert(e.message);
}
}

async function req(id,a){
try{
await api(`/api/admin/requests/${id}/${a}`,{
method:"POST",
body:"{}"
});
adminLoad();
}catch(e){
alert(e.message);
}
}

function logout(){
token="";
role="";
localStorage.removeItem("rl_token");
localStorage.removeItem("rl_role");
if(sock)sock.disconnect();
show("auth");
}

if(token){
role==="admin"?adminLoad():me();
}
</script>
</body>
</html>
